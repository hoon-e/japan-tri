name: Update flight prices

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 */4 * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: update-flight-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh Google Flights prices
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/update-flight-prices.mjs

      - name: Validate generated data
        run: npm test

      - name: Commit updated prices
        run: |
          if git diff --quiet -- src/flight-prices.json; then
            echo "No price changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flight-prices.json
          git commit -m "data: refresh flight prices"
          git push
